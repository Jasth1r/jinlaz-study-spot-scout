<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olist Seller Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
    h1 { margin-bottom: 0.2rem; }
    .sub { color: #52606d; margin-top: 0; }
    #status { padding: 0.5rem 0.75rem; border-radius: 6px; margin: 1rem 0; font-size: 0.95rem; }
    .ok { background: #e3f9e5; } .bad { background: #ffe3e3; }
    select, button { font-size: 1rem; padding: 0.3rem 0.6rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #d9e2ec; }
    th { background: #f0f4f8; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>Olist Seller Explorer</h1>
  <p class="sub">Browser &rarr; your Node server &rarr; SQL Server on the class server.</p>

  <div id="status">Checking the database connection&hellip;</div>

  <label for="state">Seller state:</label>
  <select id="state"></select>
  <button id="go">Show top sellers</button>

  <table id="results" hidden>
    <thead><tr><th>Seller</th><th>City</th><th>Items sold</th><th>Revenue (R$)</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    // The page never talks to the database. It only calls our own server's /api routes.
    const statusBox = document.getElementById('status');

    async function getJSON(url) {
      const r = await fetch(url);
      const body = await r.json();
      if (!r.ok) throw new Error(body.error || r.statusText);
      return body;
    }

    async function checkHealth() {
      try {
        const h = await getJSON('/api/health');
        statusBox.textContent = `Connected to database ${h.db} as ${h.login_name}.`;
        statusBox.className = 'ok';
        return true;
      } catch (e) {
        statusBox.textContent = `No database connection: ${e.message}. Are you on UW Wi-Fi or the Husky OnNet VPN, and is your .env file filled in?`;
        statusBox.className = 'bad';
        return false;
      }
    }

    async function loadStates() {
      const states = await getJSON('/api/states');
      document.getElementById('state').innerHTML = states
        .map(s => `<option value="${s.seller_state}">${s.seller_state} (${s.sellers} sellers)</option>`)
        .join('');
    }

    async function showTopSellers() {
      const state = document.getElementById('state').value;
      const rows = await getJSON('/api/top-sellers?state=' + encodeURIComponent(state));
      const fmt = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
      const tbody = document.querySelector('#results tbody');
      tbody.innerHTML = '';
      for (const r of rows) {
        const tr = document.createElement('tr');
        [r.seller_id.slice(0, 8) + '…', r.seller_city].forEach(v => {
          const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
        });
        [r.items_sold, fmt.format(r.revenue)].forEach(v => {
          const td = document.createElement('td'); td.className = 'num'; td.textContent = v; tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
      document.getElementById('results').hidden = false;
    }

    document.getElementById('go').addEventListener('click', () =>
      showTopSellers().catch(e => { statusBox.textContent = e.message; statusBox.className = 'bad'; }));

    checkHealth().then(ok => ok && loadStates());
  </script>
</body>
</html>
